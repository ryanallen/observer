<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observer</title>
<meta name="description" content="A system built to observe human minds looks through a stone at the point where every line meets.">
<style>
/* each font cut to the one weight and the characters the page uses, so the page stays small on a phone */
@font-face { font-family: Cormorant; src: url(fonts/cormorant-300.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: Cormorant; src: url(fonts/cormorant-italic-400.woff2) format('woff2'); font-style: italic; font-weight: 400; }
@font-face { font-family: Mono; src: url(fonts/mono-400.woff2) format('woff2'); font-weight: 400; }
:root { --ink: #e9e4da; --dim: #8f8a80; --bg: #050506; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: Cormorant, Georgia, serif; -webkit-font-smoothing: antialiased; cursor: default; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#bay, #lab, #study { opacity: 0; }
.cap { position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%); width: min(92vw, 760px); text-align: center;
  font-style: italic; font-weight: 400; font-size: clamp(20px, 2.6vw, 30px); line-height: 1.35; letter-spacing: .01em;
  opacity: 0; transition: opacity 1.4s ease; pointer-events: none; text-shadow: 0 0 18px #000; text-wrap: balance; }
.cap.on { opacity: 1; }
.place { position: fixed; left: 28px; top: 24px; font-family: Mono, monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase;
  color: var(--dim); opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
.place.on { opacity: 1; }
.skip { position: fixed; right: 24px; bottom: 20px; font-family: Mono, monospace; font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
  color: #4d4a45; background: none; border: 0; cursor: pointer; padding: 8px; }
.skip:hover { color: var(--dim); }
.sound { position: fixed; left: 18px; bottom: 14px; width: 40px; height: 40px; padding: 9px; background: none; border: 0; cursor: pointer; color: #8f8a80; transition: color .3s; }
.sound:hover { color: var(--ink); }
/* the review menu: hidden from the public; the backquote key opens it, or ?dev shows it on load */
.dev { position: fixed; right: 12px; top: 12px; z-index: 20; max-height: calc(100% - 24px); overflow: auto; padding: 6px 0; background: rgba(8,8,9,.9);
  border: 1px solid #2a2825; font-family: Mono, monospace; font-size: 11px; letter-spacing: .08em; }
.dev[hidden] { display: none; }
.dev a { display: block; padding: 5px 14px; color: var(--dim); text-decoration: none; white-space: nowrap; }
.dev a:hover, .dev a.on { color: var(--ink); background: #1b1a18; }
.devbtn { position: fixed; right: 8px; top: 8px; z-index: 21; width: 32px; height: 32px; background: rgba(8,8,9,.6); border: 1px solid #2a2825; color: var(--dim); font-size: 16px; padding: 0; }
.devbtn[hidden] { display: none; }
.dev:not([hidden]) ~ .devbtn { display: none; }
.sound svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sound svg path:first-child { fill: currentColor; fill-opacity: .18; }
/* the icon shows the state; hovering shows the state a click will give */
.sound .i-off, .sound.muted .i-on, .sound:hover .i-on, .sound.muted:hover .i-off { display: none; }
.sound.muted .i-off, .sound:hover .i-off, .sound.muted:hover .i-on { display: block; }
@media (hover: none) { .sound:hover .i-off { display: none; } .sound:hover .i-on { display: block; } .sound.muted:hover .i-on { display: none; } .sound.muted:hover .i-off { display: block; } }
.tip { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); font-family: Mono, monospace; font-size: 10px; letter-spacing: .3em;
  text-transform: uppercase; color: var(--dim); padding-left: .3em; opacity: 0; transition: opacity 1.6s ease; pointer-events: none; white-space: nowrap; }
.tip.on { opacity: .55; }
/* the way in: a button where the point will be. Clicked, it trembles, snaps flat into a line, and the line snaps shut
   into the point */
.begin { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: Mono, monospace; font-size: 11px; letter-spacing: .42em;
  text-transform: uppercase; color: #0a0a0b; background: var(--ink); border: 1px solid var(--ink); border-radius: 999px; padding: 13px 24px 13px calc(24px + .42em); font-weight: 400;
  cursor: pointer; opacity: 0; transition: opacity 1.4s ease, border-color .3s, background .3s, letter-spacing .9s cubic-bezier(.16, 1, .3, 1), padding-left .9s cubic-bezier(.16, 1, .3, 1);
  outline: 1px solid rgba(233,228,218,0); outline-offset: 0; }
.begin.on { opacity: .9; }
.begin:hover, .begin:focus-visible { background: #fff; border-color: #fff; box-shadow: 0 0 28px rgba(255,246,228,.18); }
/* hovered: two hairlines draw out from its ends toward the edges of the screen, foreshadowing the lines and the snap to a
   line; a ping widens off it faster than the point's heartbeat; its letters open a little. Phones have no hover */
.begin::before, .begin::after { content: ''; position: absolute; top: 50%; width: 50vw; height: 1px; pointer-events: none;
  transform: scaleX(0); transition: transform .6s cubic-bezier(.5, 0, .75, 0); }
.begin::before { right: 100%; transform-origin: right center; background: linear-gradient(to left, rgba(233,228,218,.25), rgba(233,228,218,0)); }
.begin::after { left: 100%; transform-origin: left center; background: linear-gradient(to right, rgba(233,228,218,.25), rgba(233,228,218,0)); }
@media (hover: hover) {
  .begin.on:hover:not(.tremble):not(.line):not(.shut) { letter-spacing: .5em; padding-left: calc(24px + .5em); animation: quickPing 1.1s cubic-bezier(.2, .6, .4, 1) infinite; }
  .begin.on:hover:not(.tremble):not(.line):not(.shut)::before, .begin.on:hover:not(.tremble):not(.line):not(.shut)::after { transform: scaleX(1); transition: transform .9s cubic-bezier(.16, 1, .3, 1); }
}
@keyframes quickPing { from { outline-offset: 0; outline-color: rgba(233,228,218,.45); } to { outline-offset: 22px; outline-color: rgba(233,228,218,0); } }
.begin:focus-visible { outline: 1px solid rgba(233,228,218,.45); outline-offset: 4px; }
.begin.tremble::before, .begin.tremble::after, .begin.line::before, .begin.line::after { transform: scaleX(0); transition: transform .2s; }
.begin.tremble, .begin.line, .begin.shut { animation: none; outline-color: rgba(233,228,218,0); }
.begin.tremble { animation: tremble .5s linear; }
@keyframes tremble {
  0% { transform: translate(-50%, -50%); } 10% { transform: translate(calc(-50% + 1px), calc(-50% - 1px)); } 20% { transform: translate(calc(-50% - 1px), calc(-50% + 1px)); }
  30% { transform: translate(calc(-50% + 2px), -50%); } 40% { transform: translate(calc(-50% - 2px), calc(-50% - 1px)); } 50% { transform: translate(calc(-50% + 2px), calc(-50% + 2px)); }
  60% { transform: translate(calc(-50% - 3px), calc(-50% - 1px)); } 70% { transform: translate(calc(-50% + 3px), calc(-50% + 1px)); } 80% { transform: translate(calc(-50% - 3px), calc(-50% + 2px)); }
  90% { transform: translate(calc(-50% + 4px), calc(-50% - 2px)); } 100% { transform: translate(-50%, -50%); } }
.begin.line { opacity: 1; color: transparent; background: var(--ink); border-color: var(--ink); transform: translate(-50%, -50%) scaleY(.04);
  transition: transform .11s cubic-bezier(.6, 0, 1, 1), background .06s, color .04s; }
.begin.shut { transform: translate(-50%, -50%) scale(0, .04); transition: transform .14s cubic-bezier(.7, 0, 1, 1); }
@media (max-width: 600px) { .place { left: 16px; top: 16px; } .cap { bottom: 14%; } }
</style>
</head>

<canvas id="bay"></canvas>
<canvas id="lab"></canvas>
<canvas id="study"></canvas>
<canvas id="c"></canvas>
<div class="cap" id="cap"></div>
<div class="place" id="place"></div>
<button class="skip" id="skip" aria-label="Skip to hold">skip</button>
<button class="sound" id="sound" aria-label="Turn sound off">
  <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="w" d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="m16 9.5 5 5m0-5-5 5"/></svg>
</button>
<div class="tip" id="tip"></div>
<nav class="dev" id="dev" hidden></nav>
<button class="devbtn" id="devbtn" hidden aria-label="Scenes">&equiv;</button>
<button class="begin" id="begin">observe</button>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script>

    monitor: 0,       // the monitor flickering on, 0 to 1
    firing: false,    // the laser firing single photons at the stone

    burst: 0,         // the lines bursting out, bouncing round the room and settling into the steeple's outline, 0 to 1
    sunset: 0,        // the sunset glow blooming behind the steeple's outline, 0 to 1
    eyeImg: 0,        // her eye, close, painted, landing at the end of the push, 0 to 1
    eyeChurch: 0,     // the painted church in her iris taking over from the drawn steeple, 0 to 1
    steeple: 0,       // the steeple's inside darkening to black against it, 0 to 1
    vid: 0,           // the push into her eye, the iris melting to rainbow (a video), faded in over the room, 0 to 1
    flick: 0,         // the steeple flickering between her pupil and the field glasses' lens, 0 to 1
    out: 0,           // the view pulling out of the glasses into Blake's study, 0 to 1
    clear: 0,         // the ring clearing it on a later heartbeat, 0 to 1
    lab: 0,           // the lab is showing
    study: 0,         // Blake's study is showing
    pt: 0,            // the point's visibility
    py: .5,           // its height on screen, as a fraction
    lines: 0,         // how far the converging lines have drawn
    linesA: 0,        // their opacity
    ring: 0,          // the hold ring
    flare: 0,         // the flash when the hold completes
    sea: 0,           // the bay: snow, the lamp's cone, the floor
    sink: 0,          // how far down the lamp has gone
    floor: 0,         // the silt rising into the light
    box: 0,           // the box caught in the light
    eye: 0,           // 1 once the pings are eyes
    pull: 0,          // the followed line straightened out to the left and lengthened, 0 to 1
    sweep: 0,         // one line swinging counter-clockwise round the point, gathering every line into the followed one

  const q0 = new URLSearchParams(location.search);

  const BEATS = [['observe', 'OBSERVE'], ['point', 'the point'], ['lines', 'the lines'], ['sweep', 'the sweep and pan'],
    ['bay', 'the bay zoomed out'], ['drop', 'the zoom and drop'], ['underwater', 'underwater'], ['floor', 'the floor'], ['dark', 'the dark beat'],
    ['lab', 'the lab'], ['open', 'the box opens'], ['machine', 'the machine fires'], ['swing', 'the swing to Ruth'], ['steeple', 'the steeple'],

  const AT = q0.get('at');
  const SCENE_OF = { point: 'opening', lines: 'opening', sweep: 'opening', bay: 'bay', drop: 'bay', underwater: 'bay', floor: 'bay', dark: 'bay',

  const loadBay = () => bayLoad || (bayLoad = import('./bay.js?v=' + (q0.get('v') || 'b86')).then(m => { bay = m.createBay($('bay')); window.observerBay = bay; bay.ready.then(() => setTimeout(() => bay.warm(quiet), 400)); return bay; }).catch(e => { console.warn('bay', e); return null; }));

  const loadLab = () => labLoad || (labLoad = import((lab3d ? './lab3d.js?v=' : './lab.js?v=') + (q0.get('v') || 'b86')).then(m => { lab = m.createLab($('lab'), lab3d ? { room: q0.get('room') || 'models/web/lab_room.glb', view: q0.get('view'), noBoxMerge: q0.has('nobm'), ruth3d: q0.get('ruth') !== 'plate', liveBox: q0.has('livebox') } : undefined); window.observerLab = lab; if (lab3d && q0.get('proj') !== '0') lab.loadProjection(); return lab.ready.then(() => lab); }).catch(e => { console.warn('lab', e); return null; }));

  const loadStudy = () => studyLoad || (studyLoad = import('./study.js?v=' + (q0.get('v') || 'b86')).then(m => { study = m.createStudy($('study')); window.observerStudy = study; return study.ready.then(() => study); }).catch(e => { console.warn('study', e); return null; }));
  const P = { x: 0, y: 0 };   // the point on screen this frame
  // the bay's shaders are made ready while the opening is quiet: between pings, with no line, eye or pan moving; once the
  // bay is showing, at once
  const quiet = () => new Promise(r => { const chk = () => {
    const ph = (t % 3.33) / 3.33, eyeMoving = S.eye > 0 && t - eyeT0 < 2.8;
    const moving = (S.lines > 0 && S.lines < 1) || (S.pull > 0 && S.pull < 1) || eyeMoving || S.follow > 0;

  const wait = ms => new Promise(r => setTimeout(r, ff ? 1 : reduce ? Math.min(ms, 600) : ms));
  let skipping = false;
  // a line on screen, and the Observer's recording of it where there is one; the line stays up while it is spoken
  const VOICE = { 'This is a point.': 'audio/voice-this-is-a-point.mp3?v=2', 'Every line, followed far enough, comes to it.': 'audio/voice-every-line-followed-far-enough.mp3?v=1', 'Follow one line back.': 'audio/voice-follow-one-line-back.mp3?v=1', 'In 1935, Dr Dexter sank the Shining Trapezohedron here.': 'audio/voice-in-1935-dr-dexter-sank.mp3?v=1', 'Now his great-granddaughter has come for it.': 'audio/voice-now-his-great-granddaughter.mp3?v=1', 'Ninety years in the dark.': 'audio/voice-ninety-years-in-the-dark.mp3?v=1', 'In the dark, it wakes.': 'audio/voice-in-the-dark-it-wakes.mp3?v=1' };
  const say = async (text, hold) => {
    if (skipping || ff) return;

    release(text);
  };

  // ---- the converging lines: from all round the edge, in to the point ----
  const rays = Array.from({ length: 40 }, (_, i) => {
    const a = i / 40 * Math.PI * 2;   // evenly spaced: the horizontal ones run exactly level through the point
    return { a, d: .55 + ((Math.sin(i * 78.233) * 43758.5) % 1 + 1) % 1 * .45, delay: (i * 7 % 40) / 40 };
  });

  const followRay = rays.reduce((best, ray) => Math.abs(ray.a - Math.PI) < Math.abs(best.a - Math.PI) ? ray : best, rays[0]);
  // the sweep starts on the line just below it (on screen) and turns counter-clockwise, down, right, up and round,
  // gathering each line it meets, until it lands on the followed line
  const sweepStart = rays.filter(r => r !== followRay && r.a < followRay.a).reduce((best, r) => r.a > best.a ? r : best);
  const sweepEnd = followRay.a - Math.PI * 2;
  const sweepAt = () => sweepStart.a - S.sweep * (sweepStart.a - sweepEnd);
  const swept = r => (r.a > sweepStart.a + 1e-9 ? r.a - Math.PI * 2 : r.a) >= sweepAt() - 1e-6;
  // ---- the title, drawn once offscreen so the eye can uncover it ----
  const titleCv = document.createElement('canvas'), tg = titleCv.getContext('2d');
  let titleW = 0, titleH = 0;
  const drawTitle = () => {
    const fs = Math.max(34, Math.min(76, W * .06)), sp = fs * .42, word = 'OBSERVER';
    tg.font = `300 ${fs}px Cormorant`;
    const ws = [...word].map(c => tg.measureText(c).width), tw = ws.reduce((a, b) => a + b, 0) + sp * (word.length - 1);

    tg.setTransform(D, 0, 0, D, 0, 0); tg.font = `300 ${fs}px Cormorant`; tg.fillStyle = '#e9e4da'; tg.textBaseline = 'middle';
    let x = 0; [...word].forEach((c, i) => { tg.fillText(c, x, titleH / 2); x += ws[i] + sp; });
  };
  document.fonts.load('300 76px Cormorant').then(drawTitle); addEventListener('resize', () => document.fonts.ready.then(drawTitle));
  // an eye: two arcs meeting in points left and right
  const eyePath = (x, y, a, b) => {
    g.beginPath(); g.moveTo(x - a, y);
    g.quadraticCurveTo(x, y - b * 2, x + a, y); g.quadraticCurveTo(x, y + b * 2, x - a, y); g.closePath();
  };
  let eyeT0 = 1e9, lastBeat = -1;     // when the eye leaves (with a ping); the last ping that beat

  // effects) into one output, so a phone that plays only one media stream at a time still hears them all together.

  let ac = null, bus = null, beatN = 0, soundOn = false;
  const synth = new URLSearchParams(location.search).get('beat') === 'synth';
  const qs = new URLSearchParams(location.search);
  // name: [file, bus, level, loops]. The lines' sound and the pull are cut from a waterphone and an Apprehension Engine
  // (?lines=a-d, ?pull=a-b to compare); the follow from waterphone.wav 98.8-106.8 s with a quiet two-tap echo tail; the
  // tremble is a little of the Apprehension Engine while OBSERVE trembles; the descent is the splash, bubbles, the deep
  const SOUNDS = {
    beat1: ['audio/heartbeat-1.mp3', 'sfx', .9], beat2: ['audio/heartbeat-2.mp3', 'sfx', .9],
    lines: [`audio/lines-${/^[a-d]$/.test(qs.get('lines')) ? qs.get('lines') : 'a'}.mp3`, 'sfx', .55],
    pull: [`audio/pull-${/^[ab]$/.test(qs.get('pull')) ? qs.get('pull') : 'a'}.mp3`, 'sfx', .8],
    follow: ['audio/line-follow.mp3?v=1', 'bed', .4], tremble: ['audio/tremble.mp3?v=1', 'sfx', .6],
    splash: ['audio/splash.mp3?v=1', 'sfx', .7], splash2: ['audio/splash.mp3?v=1', 'sfx', .45],
    bubbles: ['audio/bubbles-loop.mp3?v=1', 'bed', .35, true], deep: ['audio/deep-loop.mp3?v=1', 'bed', .55, true],
    blake: ['audio/voice-ruth-blake.mp3?v=1', 'voice', 1],   // Ruth, scared, as the steeple forms in her eye
    iris: ['audio/iris-rise.mp3?v=1', 'sfx', .9],   // the hurdy-gurdy and waterphone swelling into echoes; its peak at 4.2 s
  };

    return ac;
  };
  // the fallback for one sound: an audio element, loaded and primed muted inside the click so later plays are allowed

      glow.addColorStop(.12, `rgba(255,236,206,${(.2 + .15 * kick) * pointInk})`);
      glow.addColorStop(1, 'rgba(255,236,206,0)');
      g.fillStyle = glow; g.beginPath(); g.arc(cx, cy, gr * 3, 0, Math.PI * 2); g.fill();
      g.fillStyle = `rgba(255,252,244,${pointInk})`; g.beginPath(); g.arc(cx, cy, 1.8 + .8 * kick, 0, Math.PI * 2); g.fill();
      const out = 1 - Math.pow(1 - ph, 3), fade = Math.pow(1 - ph, 2) * S.pt * (1 - S.sea * .5);
      g.lineWidth = 1.2;
      // the ping, every bar, always
      g.strokeStyle = `rgba(255,246,228,${.55 * fade})`;
      g.beginPath(); g.arc(cx, cy, 4 + out * Math.min(W, H) * .22, 0, Math.PI * 2); g.stroke();
      // the eye: once, leaving with a ping, opening out past the title and staying open; the title shows wherever it has passed
      if (S.eye > 0 && t >= eyeT0) {
        const pe = Math.min(1, (t - eyeT0) / 2.6), eo = 1 - Math.pow(1 - pe, 3);
        const A = W * .45, B = H * .36, ea = S.pt * S.eye * (.75 - .4 * pe);
        if (titleW && S.titleA > 0) {
          g.save(); eyePath(cx + eyeDx, cy + eyeDy, A * eo + 1, B * eo + 1); g.clip(); g.globalAlpha = S.titleA;
          g.drawImage(titleCv, cx - titleW / 2 + openingCam.x * W * .007 * openingDepth, H * .27 - titleH / 2 + openingCam.y * H * .0045 * openingDepth, titleW, titleH); g.restore();
        }
        g.strokeStyle = `rgba(255,246,228,${ea})`; eyePath(cx + eyeDx, cy + eyeDy, 4 + A * eo, 2 + B * eo); g.stroke();
      }
      // the heartbeat, on each ping
      const n = Math.floor(t / 3.33); if (n !== lastBeat) { lastBeat = n; if (S.pt > .5) beat(); if (lab) lab.st.pulse = 1; beatWaiters.splice(0).forEach(f => f()); }
    }
    // the hold ring
    // the ring fills round the cursor while it rests on the point
    if (S.ring > 0 && mouse.on) {
      const rr = 22, rx = mouse.x, ry = mouse.y;
      g.strokeStyle = 'rgba(233,228,218,.14)'; g.lineWidth = 1; g.beginPath(); g.arc(rx, ry, rr, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = 'rgba(233,228,218,.9)'; g.lineWidth = 1.6; g.beginPath(); g.arc(rx, ry, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * S.ring); g.stroke();
    }
    drawMachine();
    drawP4();
    if (S.dark > 0) drawDark();
    if (washT0 === -1 && bay && S.bay > 0 && bay.camera.position.y < 0) washT0 = t;   // the wash starts on the very frame the view goes under
    if (washT0 >= 0) { const k = (t - washT0) / 1.3; if (k >= 1) washT0 = -2; else drawWash(k); }   // -2: it has played, once
    if (S.flare > 0) { g.fillStyle = `rgba(255,248,236,${S.flare * .9})`; g.fillRect(0, 0, W, H); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---- observing: on a desktop, resting the cursor on the point fills a ring round it in 0.6 s; a tap on a phone, or
  // Enter, is enough at once ----
  let canHold = false, holding = false, done = null, armed = false;
  const HOLD = .6, mouse = { x: 0, y: 0, on: false };
  const near = () => Math.hypot(mouse.x - P.x, mouse.y - P.y) < Math.max(60, Math.min(W, H) * .07);
  let holdLast = 0;
  const tick = now => {
    if (!canHold) return;
    const elapsed = Math.min(.05, Math.max(0, (now - holdLast) / 1000)); holdLast = now;
    // every observe is a new choice: a cursor already resting on the point has to leave it and come back
    if (!armed && !(mouse.on && near())) armed = true;
    holding = armed && mouse.on && near();
    if (bay && S.bay > .95 && !bay.st.dive) bay.st.zoomTarget = holding ? 1 : 0;
    S.ring = Math.max(0, Math.min(1, S.ring + (holding ? 1 : -2) * elapsed / HOLD));
    if (S.ring >= 1) { canHold = false; done && done('mouse'); return; }
    requestAnimationFrame(tick);
  };
  const finish = () => { if (canHold) { if (bay && S.bay > .95) bay.st.zoomTarget = 1; S.ring = 1; canHold = false; done && done('tap'); } };
  addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true; }
    // the pointer racks the bay's focus
    if (bay) { bay.look.x = Math.max(-1, Math.min(1, e.clientX / W * 2 - 1)); bay.look.y = Math.max(-1, Math.min(1, e.clientY / H * 2 - 1)); }
    if (study) study.setPointer(Math.max(-1, Math.min(1, e.clientX / W * 2 - 1)), Math.max(-1, Math.min(1, e.clientY / H * 2 - 1)));
    if (lab) lab.setPointer(Math.max(-1, Math.min(1, e.clientX / W * 2 - 1)), Math.max(-1, Math.min(1, e.clientY / H * 2 - 1)));
  });
  document.addEventListener('mouseleave', () => { mouse.on = false; });
  // a tap observes only on the thing itself (within about 44 px of it: the point, the lamp, the stone, the box); a tap
  // anywhere else does nothing
  const TAP = 44;
  addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || e.target.id === 'skip' || e.target.id === 'begin' || (e.target.closest && e.target.closest('#sound'))) return;
    if (Math.hypot(e.clientX - P.x, e.clientY - P.y) <= TAP) finish();
  });
  addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && canHold) { e.preventDefault(); finish(); } });
  const waitHold = () => ff ? Promise.resolve() : new Promise(res => { done = res; canHold = true; armed = !(mouse.on && near()); holdLast = performance.now(); requestAnimationFrame(tick); });

  const showSound = () => { $('sound').classList.toggle('muted', !want); $('sound').setAttribute('aria-label', want ? 'Turn sound off' : 'Turn sound on'); };
  showSound();
  $('sound').onclick = e => {
    e.stopPropagation(); want = !want; try { localStorage.setItem('observer-sound', want ? 'on' : 'off'); } catch (err) {}
    if (want) startSound(); else { soundOn = false; if (bus) bus.master.gain.setTargetAtTime(0, ac.currentTime, .02); for (const k in live) if (live[k].el) live[k].el.pause(); }
    showSound(); hideTip('sound');
  };
  // the first tap or key lets the sound start (a browser plays nothing before one)
  const firstGesture = e => {
    if (e.target && e.target.closest && e.target.closest('#sound')) return;
    removeEventListener('pointerdown', firstGesture); removeEventListener('keydown', firstGesture);
    hideTip('sound'); if (want) { startSound(); resumeBed(); }
  };
  // a beat opened from the review menu: once the sound can start, the bed that would be playing there comes in (the deep
  // water once the view is under it); the heartbeat and every later sound play as they come
  const resumeBed = () => {
    if (!soundOn || live.deep || !bay || !(bay.camera.position.y < 0) || S.lab > 0) return;
    if (play('deep', { gain: 0 })) fade('deep', .55, 2500);
  };
  addEventListener('pointerdown', firstGesture); addEventListener('keydown', firstGesture);
  // where the browser already allows it, start at once
  if (want) { startSound(); if (ac && ac.state === 'running') { removeEventListener('pointerdown', firstGesture); removeEventListener('keydown', firstGesture); } }
  $('skip').onclick = () => { skipping = true; $('cap').classList.remove('on'); $('skip').style.display = 'none'; };

  // ---- while OBSERVE waits: after the first paint, in idle moments, the bay (three.js, its models and plate) loads and its
  // shaders are made ready, and the ping's gradient is drawn once offscreen, so nothing stalls once it starts ----
  const whenIdle = f => window.requestIdleCallback ? requestIdleCallback(f, { timeout: 1500 }) : setTimeout(f, 200);
  addEventListener('load', () => whenIdle(() => {
    if (q0.get('at')) return;
    loadBay();
    const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 30); gr.addColorStop(0, 'rgba(255,246,228,.9)'); gr.addColorStop(1, 'rgba(255,236,206,0)');
    x.fillStyle = gr; x.beginPath(); x.arc(32, 32, 30, 0, 7); x.fill(); x.strokeStyle = 'rgba(255,246,228,.5)'; x.beginPath(); x.arc(32, 32, 20, 0, 7); x.stroke();
  }));
  // ---- tips: at the very bottom, faint, shown for a few seconds only when needed ----
  let tipKey = null, tipTimer = 0;
  const tip = (key, text, ms) => { clearTimeout(tipTimer); tipKey = key; $('tip').textContent = text; $('tip').classList.add('on'); tipTimer = setTimeout(() => hideTip(key), ms); };
  const hideTip = key => { if (tipKey === key) { $('tip').classList.remove('on'); tipKey = null; } };
  // ---- the review menu: a link for every beat; the backquote key opens and closes it, and while it is open the left and
  // right arrows step between beats; on a phone, ?dev adds a small corner button for it ----
  {
    const nav = $('dev'), btn = $('devbtn'), here = Math.max(0, BEATS.findIndex(b => b[0] === AT));
    const go = i => { location.search = '?at=' + BEATS[i][0] + '&dev'; };
    BEATS.forEach(([k, label], i) => {
      const a = document.createElement('a'); a.href = '?at=' + k + '&dev'; a.textContent = label; if (AT && i === here) a.className = 'on';
      a.onclick = e => { e.preventDefault(); e.stopPropagation(); go(i); }; nav.appendChild(a);
    });
    nav.hidden = !q0.has('dev');
    if (q0.has('dev') && matchMedia('(pointer: coarse)').matches) btn.hidden = false;
    btn.onclick = e => { e.stopPropagation(); nav.hidden = !nav.hidden; };
    for (const el of [nav, btn]) el.addEventListener('pointerdown', e => e.stopPropagation());
    addEventListener('keydown', e => {
      if (e.key === '`') { e.preventDefault(); e.stopPropagation(); nav.hidden = !nav.hidden; return; }
      if (nav.hidden) return;
      if (e.key === 'ArrowRight' && here < BEATS.length - 1) go(AT ? here + 1 : 1);
      if (e.key === 'ArrowLeft' && here > 0) go(here - 1);
    }, true);
  }
  // ---- the opening ----
  (async () => {
    // nothing but the way in; its click is what lets a browser play the sound
    const b = $('begin'); await wait(400); b.classList.add('on'); b.focus({ preventScroll: true });
    const scene = SCENE_OF[AT];
    if (scene === 'opening') { b.remove(); loadBay(); }
    else if (scene === 'bay') { b.remove(); S.pt = 1; skipping = false; loadBay(); await bayScene(); return; }
    else if (scene === 'lab') { b.remove(); S.pt = 1; S.bay = 1; S.dark = 1; skipping = false; if (await loadLab()) await labScene(); return; }
    if (q0.get('at') === 'bay') { b.remove(); S.pt = 1; skipping = false; loadBay(); await bayScene(); return; }
    if (q0.get('at') === 'pullout') {   // for tests: from the end of the iris video through the pull-out into the study
      b.remove(); S.pt = 0; skipping = false; p4Ready = await loadP4(); loadStudy(); await loadStudy();
      P4vid().currentTime = 2.99; S.vid = 1; await wait(800);
      window.__irisGo = true; await tween('flick', 1, 600, k => k); await wait(500); await tween('out', 1, 5200, k => k);
      study.render(0); $('study').style.opacity = 1; S.study = 1; return;
    }
    if (q0.get('at') === 'study') { b.remove(); S.pt = 0; skipping = false; if (await loadStudy()) { $('study').style.opacity = 1; S.study = 1; } return; }
    if (q0.get('at') === 'lab') { b.remove(); S.pt = 1; S.bay = 1; S.dark = 1; skipping = false; if (await loadLab()) await labScene(); return; }
    if (scene !== 'opening') {
      await new Promise(res => b.addEventListener('click', e => { e.stopPropagation(); if (want) { startSound(); play('tremble'); } loadBay(); res(); }, { once: true }));
      b.blur(); b.classList.add('tremble'); await wait(500);
      b.classList.remove('tremble'); b.classList.add('line'); await wait(110);
      b.classList.add('shut'); await wait(140);
      b.remove();
    }
    // the point, born where the line shut, and its first heartbeat at once
    t = 0; lastBeat = -1; S.pt = 1;
    mark('point');
    await wait(2200);
    await say('This is a point.', 3200);
    mark('lines');
    tween('linesA', 1, 1600); tween('lines', 1, 6500, t => t); if (!skipping && !ff) play('lines');
    await say('Every line, followed far enough, comes to it.', 5200);
    await wait(skipping ? 0 : 600);
    tween('lines', 1, 300); $('skip').style.display = 'none';
    eyeT0 = Math.ceil(t / 3.33) * 3.33; S.eye = 1; S.titleA = 1; await wait((eyeT0 - t) * 1000 + 2400);
    // the tip only if the point has not been observed after a while, and again now and then
    const howTo = matchMedia('(hover: hover) and (pointer: fine)').matches ? 'rest the cursor on the point' : 'tap the point';
    let observed = false;
    (async () => { await wait(4000); while (!observed) { tip('observe', howTo, 4500); await wait(16000); } })();
    await waitHold(); observed = true;
    hideTip('observe'); tween('titleA', 0, 900); tween('eye', 0, 900);
    // the eye and title unravel into black
    await wait(900); S.ring = 0;
    skipping = false;
    if (await loadBay()) {
      await Promise.race([bay.ready, ff ? new Promise(() => {}) : wait(8000)]);
      mark('sweep');
      play('follow');
      followVolume(true);
      const voices = (async () => {
        await say('Follow one line back.', 3400);
        followVolume(false);
      })();
      // as the line is spoken, one line swings counter-clockwise round the point, fast and faster, gathering every
      // line into the followed one; then that one straightens and the view follows it
      await tween('sweep', 1, 1200, k => k * k);
      tween('pull', 1, 400);
      await tween('follow', 1, 8400, k => k * k * (3 - 2 * k));
      S.bay = 1; tween('linesA', 0, 1400);
      await tween('edge', 0, 1000);
      S.follow = 0; $('bay').style.transform = '';
      // the opening is over: its sounds and the title's canvas are let go
      for (const k of ['lines', 'pull', 'follow', 'tremble']) release(k);
      titleCv.width = titleCv.height = 0; titleW = 0;
      await voices;
      return bayScene();
    }
    // without WebGL: the point becomes a lamp, going down on a cable into the bay
    tween('py', .3, 2800); tween('sea', 1, 3200); await wait(2600);
    $('place').textContent = 'Narragansett Bay · the deepest channel · now'; $('place').classList.add('on');
    tween('sink', 1, 9000);
    await say('In 1935, Dr Dexter sank the Shining Trapezohedron here.', 5200);
    await say('Now his great-granddaughter has come for it.', 5600);
    tween('floor', 1, 5200); await wait(2600);
    tween('box', 1, 4200);
  })();
  // the bay opens round the point: the lamp on its cable from the survey boat's A-frame, just over the water. Observed
  // again, it goes down, and the view follows it under until there is nothing but the point, pinging in the dark
  const howToNow = () => matchMedia('(hover: hover) and (pointer: fine)').matches ? 'rest the cursor on the point' : 'tap the point';
  async function bayScene() {
    await loadBay(); await Promise.race([bay.ready, wait(8000)]);
    $('skip').style.display = 'none';
    $('place').textContent = 'Narragansett Bay · the deepest channel · now'; $('place').classList.add('on');
    await tween('bay', 1, 4200);
    const howTo = matchMedia('(hover: hover) and (pointer: fine)').matches ? 'rest the cursor on the point' : 'tap the point';
    let observed = false;
    (async () => { await wait(7000); while (!observed) { tip('observe', howTo, 4500); await wait(16000); } })();
    // a cursor still resting where the point was must leave it first; coming back to it is the choice to go down
    while (mouse.on && near()) await wait(100);
    // the moment the ring fills, it is decided: the zoom and the drop start on that frame, and moving away no longer
    // cancels anything
    await waitHold();
    mark('drop');
    bay.st.diveArmed = true; bay.st.zoomTarget = 1;
    observed = true; hideTip('observe');
    S.ring = 0; $('place').classList.remove('on');
    // one continuous descent: both lines are said from the moment the lamp hits the water, and it reaches the floor just after them
    // the dive runs on its own clock, but if the floor is not ready by 90% it holds there while the lamp keeps creeping
    // down, and goes on (and the clock with it) once the floor is ready
    const diveMs = 17000; let diveK = 0, diveLast = performance.now(), heldAt = 0;
    (function diveStep(now) {
      const step = (now - diveLast) / diveMs * (ff ? 25 : 1); diveLast = now;
      if (diveK + step > .9 && !bay.floorReady) { if (!heldAt) heldAt = now; bay.st.creep = 1 - Math.exp(-(now - heldAt) / 9000); diveK = Math.max(diveK, .9); }
      else { heldAt = 0; diveK += step; }
      bay.st.dive = Math.min(1, diveK);
      if (diveK < 1) requestAnimationFrame(diveStep);
    })(diveLast);
    if (!ff || AT === 'underwater') descentSound();
    // as the view itself goes under: a wash of water and a burst of bubbles, and the splash again, softer and shorter
    (async () => {
      while (washT0 === -1) await wait(20);   // set by the frame that takes the camera under
      if (play('splash2')) { await wait(1200); stop('splash2', 400); }
      release('splash2');
    })();
    while (bay.lampY > 0) await wait(30);
    mark('underwater');
    await say('In 1935, Dr Dexter sank the Shining Trapezohedron here.', 5200);
    await say('Now his great-granddaughter has come for it.', 5600);
    while (!bay.floorReady) await wait(100);
    const left = Math.max(2500, (1 - diveK) * diveMs);
    tweenOn(bay.st, 'floor', 1, left);
    await wait(left);
    // the view holds on the lamp at the floor until the lamp is observed; only then does it close in and bring the stone
    // to the centre, the ping passing from the lamp to the stone
    mark('floor');
    let lampSeen = false;
    (async () => { await wait(7000); while (!lampSeen) { tip('observe', howTo, 4500); await wait(16000); } })();
    await waitHold(); lampSeen = true; hideTip('observe');
    S.ring = 0;
    mark('dark');
    tweenOn(bay.st, 'close', 1, 3200);
    await tweenOn(bay.st, 'stone', 1, 3200);
    // as the view settles on the stone, the next heartbeat shoots the dark out from it; the lab loads while it is black,
    // and the sea's sound goes down with the light
    const labReady = loadLab();
    await onBeat();
    fade('deep', 0, 1600);
    await tween('dark', 1, 650, k => 1 - Math.pow(1 - k, 2));
    // all black: the bay is let go, every model, texture and sound of it
    release('deep'); release('bubbles');
    bay.dispose(); $('bay').remove(); bay = null; window.observerBay = null;
    if (!(await labReady)) return;
    return labScene();
  }
  // Ruth's lab: on a heartbeat the dark clears off the room; the box on the table pings; resting on it opens it
  async function labScene() {
    // its first frame, with every shader and texture made ready, is drawn while the screen is still black
    lab.render(0); await wait(50);
    $('lab').style.opacity = 1; S.lab = 1; $('skip').style.display = 'none';
    // in the black, "Ninety years in the dark."; once it has been said, the next heartbeat clears the dark off the room,
    // the desk lamp still on
    say('Ninety years in the dark.', 2800);
    await wait(Math.max(2000, (soundLength('Ninety years in the dark.') || 2) * 1000 + 300));
    await onBeat();
    await tween('clear', 1, 900, k => 1 - Math.pow(1 - k, 2));
    S.dark = 0; S.clear = 0;
    let seen = false;
    (async () => { await wait(7000); while (!seen) { tip('observe', howToNow(), 4500); await wait(16000); } })();
    await waitHold(); seen = true; hideTip('observe');
    S.ring = 0;
    mark('open');
    // the desk lamp clicks off; a beat of darkness; then the box opens as the line is said
    switchClick();
    await tweenOn(lab.st, 'lamp', 1, 220, k => k);
    await onBeat();
    say('In the dark, it wakes.', 2600);
    await tweenOn(lab.st, 'open', 1, 2800);
    // the stone lifts out and hangs above the box, turning; the ping goes with it
    await tweenOn(lab.st, 'lift', 1, 2600);
    mark('machine');
    // the machine wakes by itself, then fires at the stone; in the 3D lab the view draws back to the whole room
    if (lab.is3d) tweenOn(lab.st, 'wide', 1, 3000);
    await wait(700);
    tween('monitor', 1, 1400, k => k);
    await tween('bench', 1, 2400, k => k);
    S.firing = true;
    // P.4: the look back
    const p4Load = Promise.all([loadP4().then(v => { p4Ready = v; }), lab.loadReverse()]);
    await wait(2600);
    say('A point of light at a time.', 2800);
    await wait(2200); await p4Load;
    mark('swing');
    // the camera swings round the hanging stone, fast, and closes in on Ruth's side; the machine's light stays behind
    S.firing = false; photons.length = 0; tween('bench', 0, 400); tween('monitor', 0, 400);
    S.pt = 0;   // no ping ring on the stone through the look back
    await tweenOn(lab.st, 'swing', 1, 1500, k => k);
    await wait(1000);
    mark('steeple');
    // a line shoots out of the stone into her eye; a beat with her eye catching the light, then the view rushes into that
    // eye, fast, blurred, and lands close on her iris; only then do the lines burst and settle into the steeple in it
    await tween('shot', 1, 300, k => k * k);
    await wait(500);
    await tweenOn(lab.st, 'eyeZoom', 1, 700, k => { lab.st.eyeBlur = Math.sin(Math.PI * k); S.eyeImg = ease01((k - .55) / .45); return k * k * (3 - 2 * k); });
    S.eyeImg = 1;
    lab.st.eyeBlur = 0; S.shot = 0;
    await tween('burst', 1, 2600, k => k);
    // the lines have settled into the outline: a sunset blooms behind it, then the inside darkens to black
    await tween('sunset', 1, 900);
    play('blake');
    await tween('steeple', 1, 900);
    // the painted church in her iris takes over from the drawn one
    await tween('eyeChurch', 1, 1000);
    await wait(400);
    // close on her eye: the sound swells so its peak lands on the flicker, 4.2 s from now (the video starts in 1.2 s, runs 3 s)
    mark('iris');
    play('iris');
    await wait(800);
    P4vid().currentTime = 0;
    await tween('vid', 1, 400);
    // the lab is done: let it go
    S.lab = 0; S.pt = 0; release('blake'); lab.dispose(); $('lab').remove(); lab = null; window.observerLab = null;
    loadStudy();
    await P4vid().play().catch(() => {});
    await new Promise(r => { const v = P4vid(); if (v.ended) r(); else { v.addEventListener('ended', r, { once: true }); setTimeout(r, 3600); } });
    // the steeple in her pupil flickers, fast, in and out with the field glasses' lens, then holds on the glasses
    await tween('flick', 1, 600, k => k);
    await wait(500);
    // the view pulls out of the glasses into Blake's study
    await tween('out', 1, 5200, k => k);
    // the study, live: the pointer shifts the view a little and racks the focus, as on the moor
    if (await loadStudy()) { study.render(0); $('study').style.opacity = 1; S.study = 1; }
    release('iris');
  }
})();
