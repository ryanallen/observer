<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observer</title>
<meta name="description" content="A system built to observe human minds looks through a stone at the point where every line meets.">
<style>
/* each font cut to the one weight and the characters the page uses, so the page stays small on a phone */
@font-face { font-family: Cormorant; src: url(fonts/cormorant-300.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: Cormorant; src: url(fonts/cormorant-italic-400.woff2) format('woff2'); font-style: italic; font-weight: 400; }
@font-face { font-family: Mono; src: url(fonts/mono-400.woff2) format('woff2'); font-weight: 400; }
:root { --ink: #e9e4da; --dim: #8f8a80; --bg: #050506; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: Cormorant, Georgia, serif; -webkit-font-smoothing: antialiased; cursor: default; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#bay { opacity: 0; }
.cap { position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%); width: min(92vw, 760px); text-align: center;
  font-style: italic; font-weight: 400; font-size: clamp(20px, 2.6vw, 30px); line-height: 1.35; letter-spacing: .01em;
  opacity: 0; transition: opacity 1.4s ease; pointer-events: none; text-shadow: 0 0 18px #000; text-wrap: balance; }
.cap.on { opacity: 1; }
.place { position: fixed; left: 28px; top: 24px; font-family: Mono, monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase;
  color: var(--dim); opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
.place.on { opacity: 1; }
.skip { position: fixed; right: 24px; bottom: 20px; font-family: Mono, monospace; font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
  color: #4d4a45; background: none; border: 0; cursor: pointer; padding: 8px; }
.skip:hover { color: var(--dim); }
.sound { position: fixed; left: 18px; bottom: 14px; width: 40px; height: 40px; padding: 9px; background: none; border: 0; cursor: pointer; color: #8f8a80; transition: color .3s; }
.sound:hover { color: var(--ink); }
.sound svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sound svg path:first-child { fill: currentColor; fill-opacity: .18; }
/* the icon shows the state; hovering shows the state a click will give */
.sound .i-off, .sound.muted .i-on, .sound:hover .i-on, .sound.muted:hover .i-off { display: none; }
.sound.muted .i-off, .sound:hover .i-off, .sound.muted:hover .i-on { display: block; }
@media (hover: none) { .sound:hover .i-off { display: none; } .sound:hover .i-on { display: block; } .sound.muted:hover .i-on { display: none; } .sound.muted:hover .i-off { display: block; } }
.tip { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); font-family: Mono, monospace; font-size: 10px; letter-spacing: .3em;
  text-transform: uppercase; color: var(--dim); padding-left: .3em; opacity: 0; transition: opacity 1.6s ease; pointer-events: none; white-space: nowrap; }
.tip.on { opacity: .55; }
/* the way in: a button where the point will be. Clicked, it trembles, snaps flat into a line, and the line snaps shut
   into the point */
.begin { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: Mono, monospace; font-size: 11px; letter-spacing: .42em;
  text-transform: uppercase; color: #0a0a0b; background: var(--ink); border: 1px solid var(--ink); border-radius: 999px; padding: 13px 24px 13px calc(24px + .42em); font-weight: 400;
  cursor: pointer; opacity: 0; transition: opacity 1.4s ease, border-color .3s, background .3s; }
.begin.on { opacity: .9; }
.begin:hover, .begin:focus-visible { background: #fff; border-color: #fff; box-shadow: 0 0 28px rgba(255,246,228,.18); outline: none; }
.begin.tremble { animation: tremble .5s linear; }
@keyframes tremble {
  0% { transform: translate(-50%, -50%); } 10% { transform: translate(calc(-50% + 1px), calc(-50% - 1px)); } 20% { transform: translate(calc(-50% - 1px), calc(-50% + 1px)); }
  30% { transform: translate(calc(-50% + 2px), -50%); } 40% { transform: translate(calc(-50% - 2px), calc(-50% - 1px)); } 50% { transform: translate(calc(-50% + 2px), calc(-50% + 2px)); }
  60% { transform: translate(calc(-50% - 3px), calc(-50% - 1px)); } 70% { transform: translate(calc(-50% + 3px), calc(-50% + 1px)); } 80% { transform: translate(calc(-50% - 3px), calc(-50% + 2px)); }
  90% { transform: translate(calc(-50% + 4px), calc(-50% - 2px)); } 100% { transform: translate(-50%, -50%); } }
.begin.line { opacity: 1; color: transparent; background: var(--ink); border-color: var(--ink); transform: translate(-50%, -50%) scaleY(.04);
  transition: transform .11s cubic-bezier(.6, 0, 1, 1), background .06s, color .04s; }
.begin.shut { transform: translate(-50%, -50%) scale(0, .04); transition: transform .14s cubic-bezier(.7, 0, 1, 1); }
@media (max-width: 600px) { .place { left: 16px; top: 16px; } .cap { bottom: 14%; } }
</style>
</head>
<body>
<canvas id="bay"></canvas>
<canvas id="c"></canvas>
<div class="cap" id="cap"></div>
<div class="place" id="place"></div>
<button class="skip" id="skip" aria-label="Skip to hold">skip</button>
<button class="sound" id="sound" aria-label="Turn sound off">
  <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="w" d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="m16 9.5 5 5m0-5-5 5"/></svg>
</button>
<div class="tip" id="tip"></div>
<button class="begin" id="begin">observe</button>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script>
(() => {
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, D;
  const size = () => { D = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; g.setTransform(D, 0, 0, D, 0, 0); };
  size(); addEventListener('resize', size);

  // ---- state the drawing reads ----
  const S = {
    pt: 0,            // the point's visibility
    py: .5,           // its height on screen, as a fraction
    lines: 0,         // how far the converging lines have drawn
    linesA: 0,        // their opacity
    ring: 0,          // the hold ring
    flare: 0,         // the flash when the hold completes
    sea: 0,           // the bay: snow, the lamp's cone, the floor
    sink: 0,          // how far down the lamp has gone
    floor: 0,         // the silt rising into the light
    box: 0,           // the box caught in the light
    eye: 0,           // 1 once the pings are eyes
    pull: 0,          // the lines pulled in to the point, 0 to 1
    titleA: 0,        // the title's opacity, inside what the eyes have uncovered
    bay: 0,           // the bay in 3D, round the point
  };
  const tweenOn = (o, k, to, ms, ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2) => new Promise(res => {
    const from = o[k], t0 = performance.now(); if (reduce) ms = Math.min(ms, 300);
    const step = now => { const t = Math.min(1, (now - t0) / ms); o[k] = from + (to - from) * ease(t); t < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
  const tween = (k, to, ms, ease) => tweenOn(S, k, to, ms, ease);
  // ---- the bay in 3D: loaded once the way in is clicked, drawn under this canvas once it shows ----
  let bay = null, bayLoad = null;
  const q0 = new URLSearchParams(location.search);
  const loadBay = () => bayLoad || (bayLoad = import('./bay.js?v=' + (q0.get('v') || 'b34')).then(m => { bay = m.createBay($('bay')); window.observerBay = bay; return bay; }).catch(e => { console.warn('bay', e); return null; }));
  const P = { x: 0, y: 0 };   // the point on screen this frame
  const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 600) : ms));
  let skipping = false;
  // a line on screen, and the Observer's recording of it where there is one; the line stays up while it is spoken
  const VOICE = { 'This is a point.': 'audio/voice-this-is-a-point.mp3?v=2', 'Every line, followed far enough, comes to it.': 'audio/voice-every-line-followed-far-enough.mp3?v=1', 'Follow one line back.': 'audio/voice-follow-one-line-back.mp3?v=1', 'It leads into Robert Blake’s mind.': 'audio/voice-it-leads-into-robert-blakes-mind.mp3?v=2', 'In 1935, Dr Dexter sank the Shining Trapezohedron here.': 'audio/voice-in-1935-dr-dexter-sank.mp3?v=1' };
  const say = async (text, hold) => {
    if (skipping) return;
    const c = $('cap'); c.textContent = text; c.classList.add('on');
    const v = sfx[text];
    if (v && soundOn) { v.currentTime = 0; v.play().catch(() => {}); hold = Math.max(hold, (v.duration || 0) * 1000 + 900); }
    await wait(hold); c.classList.remove('on'); await wait(1500);
  };

  // ---- the converging lines: from all round the edge, in to the point ----
  const rays = Array.from({ length: 40 }, (_, i) => {
    const a = i / 40 * Math.PI * 2 + (Math.sin(i * 12.9898) * .5) * .12;
    return { a, d: .55 + ((Math.sin(i * 78.233) * 43758.5) % 1 + 1) % 1 * .45, delay: (i * 7 % 40) / 40 };
  });
  // ---- the title, drawn once offscreen so the eye can uncover it ----
  const titleCv = document.createElement('canvas'), tg = titleCv.getContext('2d');
  let titleW = 0, titleH = 0;
  const drawTitle = () => {
    const fs = Math.max(34, Math.min(76, W * .06)), sp = fs * .42, word = 'OBSERVER';
    tg.font = `300 ${fs}px Cormorant`;
    const ws = [...word].map(c => tg.measureText(c).width), tw = ws.reduce((a, b) => a + b, 0) + sp * (word.length - 1);
    titleW = tw; titleH = fs * 1.3;
    titleCv.width = Math.ceil(tw * D); titleCv.height = Math.ceil(titleH * D);
    tg.setTransform(D, 0, 0, D, 0, 0); tg.font = `300 ${fs}px Cormorant`; tg.fillStyle = '#e9e4da'; tg.textBaseline = 'middle';
    let x = 0; [...word].forEach((c, i) => { tg.fillText(c, x, titleH / 2); x += ws[i] + sp; });
  };
  document.fonts.load('300 76px Cormorant').then(drawTitle); addEventListener('resize', () => document.fonts.ready.then(drawTitle));
  // an eye: two arcs meeting in points left and right
  const eyePath = (x, y, a, b) => {
    g.beginPath(); g.moveTo(x - a, y);
    g.quadraticCurveTo(x, y - b * 2, x + a, y); g.quadraticCurveTo(x, y + b * 2, x - a, y); g.closePath();
  };
  let eyeT0 = 1e9, lastBeat = -1;     // when the eye leaves (with a ping); the last ping that beat

  // ---- the heartbeat: the two beats cut from the ElevenLabs take, in turn, or one made here (?beat=synth) ----
  // sound is on unless turned off (remembered in this browser); a browser lets it start only once the page is clicked,
  // tapped or a key pressed, so until then it waits
  let want = true; try { want = localStorage.getItem('observer-sound') !== 'off'; } catch (e) {}
  let ac = null, beats = [], beatN = 0, soundOn = false;
  const synth = new URLSearchParams(location.search).get('beat') === 'synth';
  const startSound = async () => {
    if (ac) { soundOn = true; ac.resume(); [...beats, sfx.lines, sfx.pull].forEach(el => { if (!el || !el.paused) return; el.muted = true; el.play().then(() => { el.pause(); el.currentTime = 0; el.muted = false; }).catch(() => { el.muted = false; }); }); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)(); soundOn = true;
    // audio elements, not fetch, so the page plays from a file on disk as well as from a server; each is played once,
    // muted, inside the tap, so that later plays are allowed
    const load = (u, vol) => { const el = new Audio(u); el.preload = 'auto'; el.volume = vol; el.muted = true;
      el.play().then(() => { el.pause(); el.currentTime = 0; el.muted = false; }).catch(() => { el.muted = false; }); return el; };
    if (!synth) beats = ['audio/heartbeat-1.mp3', 'audio/heartbeat-2.mp3'].map(u => load(u, .9));
    // the lines' sound and the pull's, cut from a waterphone and an Apprehension Engine (?lines=a-d, ?pull=a-b to compare)
    const q = new URLSearchParams(location.search);
    sfx.lines = load(`audio/lines-${/^[a-d]$/.test(q.get('lines')) ? q.get('lines') : 'a'}.mp3`, .55);
    for (const [line, u] of Object.entries(VOICE)) sfx[line] = load(u, 1);
    sfx.pull = load(`audio/pull-${/^[ab]$/.test(q.get('pull')) ? q.get('pull') : 'a'}.mp3`, .8);
  };
  const sfx = {};
  const play = k => { if (soundOn && sfx[k]) { sfx[k].currentTime = 0; sfx[k].play().catch(() => {}); } };
  const thump = (at, f0, f1, gain) => {   // a sine dropping in pitch, a fast attack, a slow fall
    const o = ac.createOscillator(), gn = ac.createGain();
    o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + .14);
    gn.gain.setValueAtTime(0, at); gn.gain.linearRampToValueAtTime(gain, at + .008); gn.gain.exponentialRampToValueAtTime(.0008, at + .42);
    o.connect(gn).connect(ac.destination); o.start(at); o.stop(at + .45);
  };
  const beat = () => {
    if (!ac || !soundOn) return;
    const b = beats[beatN++ % 2];
    if (!synth && b) { b.currentTime = 0; b.play().catch(() => {}); return; }
    const now = ac.currentTime + .01; thump(now, 62, 38, .9); thump(now + .3, 56, 36, .55);   // lub, dub
  };
  // ---- marine snow ----
  const snow = Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), z: .3 + Math.random() * .7, s: Math.random() }));

  let t = 0, last = performance.now();

  function draw(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
    let cx = W / 2, cy = H * S.py; const R = Math.hypot(W, H);
    if (bay && S.bay > 0) {
      bay.st.fade = S.bay; bay.render(dt);
      const p = bay.screen(); cx += (p.x - cx) * S.bay; cy += (p.y - cy) * S.bay;
      g.clearRect(0, 0, W, H); if (S.bay < 1) { g.fillStyle = `rgba(5,5,6,${1 - S.bay})`; g.fillRect(0, 0, W, H); }
    } else { g.fillStyle = '#050506'; g.fillRect(0, 0, W, H); }
    P.x = cx; P.y = cy;

    // the bay: a cold dark gradient, snow drifting up past the lamp as it sinks
    if (S.sea > 0) {
      const sg = g.createLinearGradient(0, 0, 0, H);
      sg.addColorStop(0, `rgba(10,22,26,${.9 * S.sea})`); sg.addColorStop(1, `rgba(2,5,7,${S.sea})`);
      g.fillStyle = sg; g.fillRect(0, 0, W, H);
      // the lamp's cone, down from the point
      const cone = g.createRadialGradient(cx, cy, 0, cx, cy + H * .35, H * .55);
      cone.addColorStop(0, `rgba(170,200,190,${.16 * S.sea})`); cone.addColorStop(1, 'rgba(170,200,190,0)');
      g.save(); g.filter = 'blur(28px)'; g.fillStyle = cone; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx - W * .38, H * 1.05); g.lineTo(cx + W * .38, H * 1.05); g.closePath(); g.fill(); g.restore();
      // the cable the lamp hangs from
      g.strokeStyle = `rgba(120,140,140,${.25 * S.sea})`; g.lineWidth = 1; g.beginPath(); g.moveTo(cx, 0); g.lineTo(cx, cy - 4); g.stroke();
      const speed = (1 - S.floor) * (.06 + .1 * S.sink);
      for (const p of snow) {
        p.y -= speed * dt * p.z * 1.6; p.x += Math.sin(t * .3 + p.s * 9) * .00008;
        if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
        const px = p.x * W, py = p.y * H;
        const lit = Math.max(0, 1 - Math.hypot(px - cx, (py - cy) * .7) / (H * .6));
        g.fillStyle = `rgba(200,215,205,${S.sea * (.05 + .55 * lit) * p.z})`;
        g.fillRect(px, py, 1.4 * p.z, 1.4 * p.z);
      }
      // the silt floor rising into the light, and the box half in it
      if (S.floor > 0) {
        const fy = H * (1.08 - .3 * S.floor);
        const fg = g.createLinearGradient(0, fy - 40, 0, H);
        fg.addColorStop(0, 'rgba(40,46,40,0)'); fg.addColorStop(.25, `rgba(48,52,44,${.85 * S.floor})`); fg.addColorStop(1, `rgba(14,16,14,${S.floor})`);
        g.fillStyle = fg; g.beginPath(); g.moveTo(0, H);
        for (let x = 0; x <= W; x += 8) g.lineTo(x, fy + Math.sin(x * .013) * 6 + Math.sin(x * .041 + 2) * 3);
        g.lineTo(W, H); g.closePath(); g.fill();
        if (S.box > 0) {
          const bx = cx + W * .02, by = fy + Math.min(W, H) * .05, s = Math.min(W, H) * .1;
          g.save(); g.translate(bx, by); g.rotate(-.12);
          // a lopsided box, the corrosion on it catching the lamp
          const pts = [[-1.1, 0], [-.95, -.62], [-.1, -.78], [.95, -.55], [1.05, -.05], [.2, .12]];
          g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x * s, y * s) : g.moveTo(x * s, y * s)); g.closePath();
          const bg = g.createLinearGradient(0, -s * .8, 0, s * .1);
          bg.addColorStop(0, `rgba(96,92,70,${S.box})`); bg.addColorStop(1, `rgba(28,30,24,${S.box})`);
          g.fillStyle = bg; g.fill();
          g.strokeStyle = `rgba(170,160,120,${.45 * S.box})`; g.lineWidth = 1; g.beginPath(); g.moveTo(-.95 * s, -.62 * s); g.lineTo(-.1 * s, -.78 * s); g.lineTo(.95 * s, -.55 * s); g.stroke();
          // a seam of strange carving along its face
          g.strokeStyle = `rgba(60,58,44,${.8 * S.box})`; g.beginPath();
          for (let k = 0; k < 7; k++) { const x = -.8 + k * .26; g.moveTo(x * s, -.5 * s); g.quadraticCurveTo((x + .1) * s, -.25 * s, (x - .05) * s, -.05 * s); }
          g.stroke(); g.restore();
          // silt over its foot
          g.fillStyle = `rgba(30,34,28,${S.box})`; g.beginPath(); g.ellipse(bx, by + s * .1, s * 1.5, s * .14, 0, 0, Math.PI * 2); g.fill();
        }
      }
    }

    // the converging lines
    if (S.linesA > 0) {
      g.lineWidth = 1;
      for (const r of rays) {
        const p = Math.max(0, Math.min(1, (S.lines - r.delay * .6) / .4)); if (!p) continue;
        const reach = R * r.d * (1 - S.pull);
        const x0 = cx + Math.cos(r.a) * reach, y0 = cy + Math.sin(r.a) * reach;
        const x1 = x0 + (cx - x0) * p, y1 = y0 + (cy - y0) * p;
        const lg = g.createLinearGradient(x0, y0, cx, cy);
        lg.addColorStop(0, 'rgba(233,228,218,0)'); lg.addColorStop(1, `rgba(233,228,218,${.22 * S.linesA})`);
        g.strokeStyle = lg; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
      }
    }

    // the point: steady, sending out one ping a bar, a ring that widens and fades
    if (S.pt > 0) {
      const ph = (t % 3.33) / 3.33, kick = Math.exp(-ph * 14);       // a brief brightening as each ping leaves
      const gr = 18 * (1 + 6 * S.flare) * (1 - .45 * S.bay);
      const glow = g.createRadialGradient(cx, cy, 0, cx, cy, gr * 3);
      const pointInk = S.pt * (1 - S.bay);
      glow.addColorStop(0, `rgba(255,246,228,${(.6 + .35 * kick) * pointInk})`);
      glow.addColorStop(.12, `rgba(255,236,206,${(.2 + .15 * kick) * pointInk})`);
      glow.addColorStop(1, 'rgba(255,236,206,0)');
      g.fillStyle = glow; g.beginPath(); g.arc(cx, cy, gr * 3, 0, Math.PI * 2); g.fill();
      g.fillStyle = `rgba(255,252,244,${pointInk})`; g.beginPath(); g.arc(cx, cy, 1.8 + .8 * kick, 0, Math.PI * 2); g.fill();
      const out = 1 - Math.pow(1 - ph, 3), fade = Math.pow(1 - ph, 2) * S.pt * (1 - S.sea * .5);
      g.lineWidth = 1.2;
      // the ping, every bar, always
      g.strokeStyle = `rgba(255,246,228,${.55 * fade})`;
      g.beginPath(); g.arc(cx, cy, 4 + out * Math.min(W, H) * .22, 0, Math.PI * 2); g.stroke();
      // the eye: once, leaving with a ping, opening out past the title and staying open; the title shows wherever it has passed
      if (S.eye > 0 && t >= eyeT0) {
        const pe = Math.min(1, (t - eyeT0) / 2.6), eo = 1 - Math.pow(1 - pe, 3);
        const A = W * .45, B = H * .36, ea = S.pt * S.eye * (.75 - .4 * pe);
        if (titleW && S.titleA > 0) {
          g.save(); eyePath(cx, cy, A * eo + 1, B * eo + 1); g.clip(); g.globalAlpha = S.titleA;
          g.drawImage(titleCv, cx - titleW / 2, H * .27 - titleH / 2, titleW, titleH); g.restore();
        }
        g.strokeStyle = `rgba(255,246,228,${ea})`; eyePath(cx, cy, 4 + A * eo, 2 + B * eo); g.stroke();
      }
      // the heartbeat, on each ping
      const n = Math.floor(t / 3.33); if (n !== lastBeat) { lastBeat = n; if (S.pt > .5) beat(); }
    }
    // the hold ring
    // the ring fills round the cursor while it rests on the point
    if (S.ring > 0 && mouse.on) {
      const rr = 22, rx = mouse.x, ry = mouse.y;
      g.strokeStyle = 'rgba(233,228,218,.14)'; g.lineWidth = 1; g.beginPath(); g.arc(rx, ry, rr, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = 'rgba(233,228,218,.9)'; g.lineWidth = 1.6; g.beginPath(); g.arc(rx, ry, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * S.ring); g.stroke();
    }
    if (S.flare > 0) { g.fillStyle = `rgba(255,248,236,${S.flare * .9})`; g.fillRect(0, 0, W, H); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---- observing: on a desktop, resting the cursor on the point fills a ring round it in 0.6 s; a tap on a phone, or
  // Enter, is enough at once ----
  let canHold = false, holding = false, done = null;
  const HOLD = .6, mouse = { x: 0, y: 0, on: false };
  const near = () => Math.hypot(mouse.x - P.x, mouse.y - P.y) < Math.max(60, Math.min(W, H) * .07);
  let holdLast = 0;
  const tick = now => {
    if (!canHold) return;
    const elapsed = Math.min(.05, Math.max(0, (now - holdLast) / 1000)); holdLast = now;
    holding = mouse.on && near();
    if (bay && S.bay > .95) bay.st.zoomTarget = holding ? 1 : 0;
    S.ring = Math.max(0, Math.min(1, S.ring + (holding ? 1 : -2) * elapsed / HOLD));
    if (S.ring >= 1) { canHold = false; done && done('mouse'); return; }
    requestAnimationFrame(tick);
  };
  const finish = () => { if (canHold) { if (bay && S.bay > .95) bay.st.zoomTarget = 1; S.ring = 1; canHold = false; done && done('tap'); } };
  addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true; }
    // the pointer racks the bay's focus
    if (bay) { bay.look.x = Math.max(-1, Math.min(1, e.clientX / W * 2 - 1)); bay.look.y = Math.max(-1, Math.min(1, e.clientY / H * 2 - 1)); }
  });
  document.addEventListener('mouseleave', () => { mouse.on = false; });
  addEventListener('pointerdown', e => { if (e.target.id !== 'skip' && e.target.id !== 'begin' && !(e.target.closest && e.target.closest('#sound')) && e.pointerType !== 'mouse') finish(); });
  addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && canHold) { e.preventDefault(); finish(); } });
  const waitHold = () => new Promise(res => { done = res; canHold = true; holdLast = performance.now(); requestAnimationFrame(tick); });

  const showSound = () => { $('sound').classList.toggle('muted', !want); $('sound').setAttribute('aria-label', want ? 'Turn sound off' : 'Turn sound on'); };
  showSound();
  $('sound').onclick = e => {
    e.stopPropagation(); want = !want; try { localStorage.setItem('observer-sound', want ? 'on' : 'off'); } catch (err) {}
    if (want) startSound(); else soundOn = false;
    showSound(); hideTip('sound');
  };
  // the first tap or key lets the sound start (a browser plays nothing before one)
  const firstGesture = e => {
    if (e.target && e.target.closest && e.target.closest('#sound')) return;
    removeEventListener('pointerdown', firstGesture); removeEventListener('keydown', firstGesture);
    hideTip('sound'); if (want) startSound();
  };
  addEventListener('pointerdown', firstGesture); addEventListener('keydown', firstGesture);
  // where the browser already allows it, start at once
  if (want) { startSound(); if (ac && ac.state === 'running') { removeEventListener('pointerdown', firstGesture); removeEventListener('keydown', firstGesture); } }
  $('skip').onclick = () => { skipping = true; $('cap').classList.remove('on'); $('skip').style.display = 'none'; };

  // ---- tips: at the very bottom, faint, shown for a few seconds only when needed ----
  let tipKey = null, tipTimer = 0;
  const tip = (key, text, ms) => { clearTimeout(tipTimer); tipKey = key; $('tip').textContent = text; $('tip').classList.add('on'); tipTimer = setTimeout(() => hideTip(key), ms); };
  const hideTip = key => { if (tipKey === key) { $('tip').classList.remove('on'); tipKey = null; } };
  // ---- the opening ----
  (async () => {
    // nothing but the way in; its click is what lets a browser play the sound
    const b = $('begin'); await wait(400); b.classList.add('on'); b.focus({ preventScroll: true });
    if (q0.get('at') === 'bay') { b.remove(); S.pt = 1; skipping = false; loadBay(); await bayScene(); return; }
    await new Promise(res => b.addEventListener('click', e => { e.stopPropagation(); if (want) startSound(); loadBay(); res(); }, { once: true }));
    b.blur(); b.classList.add('tremble'); await wait(500);
    b.classList.remove('tremble'); b.classList.add('line'); await wait(110);
    b.classList.add('shut'); await wait(140);
    b.remove();
    // the point, born where the line shut, and its first heartbeat at once
    t = 0; lastBeat = -1; S.pt = 1;
    await wait(2200);
    await say('This is a point.', 3200);
    tween('linesA', 1, 1600); tween('lines', 1, 6500, t => t); if (!skipping) play('lines');
    await say('Every line, followed far enough, comes to it.', 5200);
    await wait(skipping ? 0 : 600);
    tween('lines', 1, 300); $('skip').style.display = 'none';
    eyeT0 = Math.ceil(t / 3.33) * 3.33; S.eye = 1; S.titleA = 1; await wait((eyeT0 - t) * 1000 + 2400);
    // the tip only if the point has not been observed after a while, and again now and then
    const howTo = matchMedia('(hover: hover) and (pointer: fine)').matches ? 'rest the cursor on the point' : 'tap the point';
    let observed = false;
    (async () => { await wait(4000); while (!observed) { tip('observe', howTo, 4500); await wait(16000); } })();
    await waitHold(); observed = true;
    hideTip('observe'); tween('titleA', 0, 900); tween('eye', 0, 900);
    // every line pulls itself into the point, slow to start and fast all the way in, then the flash
    play('pull'); await tween('pull', 1, 750, k => k * k * k);
    S.linesA = 0;
    await tween('flare', 1, 160); S.ring = 0; await tween('flare', 0, 1600);
    skipping = false;
    await say('Follow one line back.', 3400);
    await say('It leads into Robert Blake’s mind.', 3800);
    if (await loadBay()) return bayScene();
    // without WebGL: the point becomes a lamp, going down on a cable into the bay
    tween('py', .3, 2800); tween('sea', 1, 3200); await wait(2600);
    $('place').textContent = 'Narragansett Bay · the deepest channel · now'; $('place').classList.add('on');
    tween('sink', 1, 9000);
    await say('In 1935, Dr Dexter sank the Shining Trapezohedron here.', 5200);
    await say('Now his great-granddaughter has come for it.', 5600);
    tween('floor', 1, 5200); await wait(2600);
    tween('box', 1, 4200);
    await say('The stone is still inside.', 5200);
  })();
  // the bay opens round the point: the lamp on its cable from the survey boat's A-frame, just over the water. Observed
  // again, it goes down, and the view follows it under until there is nothing but the point, pinging in the dark
  async function bayScene() {
    await loadBay(); await Promise.race([bay.ready, wait(8000)]);
    $('skip').style.display = 'none';
    $('place').textContent = 'Narragansett Bay · the deepest channel · now'; $('place').classList.add('on');
    await tween('bay', 1, 4200);
    const howTo = matchMedia('(hover: hover) and (pointer: fine)').matches ? 'rest the cursor on the point' : 'tap the point';
    let observed = false;
    (async () => { await wait(7000); while (!observed) { tip('observe', howTo, 4500); await wait(16000); } })();
    // a cursor still resting where the point was must leave it first; coming back to it is the choice to go down
    while (mouse.on && near()) await wait(100);
    while (true) {
      const choice = await waitHold();
      if (choice !== 'mouse') break;
      while (mouse.on && near() && bay.st.zoom < .96) await wait(50);
      if (mouse.on && near()) break;
      bay.st.zoomTarget = 0; S.ring = 0;
      while (mouse.on && near()) await wait(100);
    }
    observed = true; hideTip('observe');
    bay.st.zoomTarget = 1;
    while (bay.st.zoom < .96) await wait(50);
    S.ring = 0; $('place').classList.remove('on');
    tweenOn(bay.st, 'dive', 1, 24000, k => k);
    await wait(15000);
    await say('In 1935, Dr Dexter sank the Shining Trapezohedron here.', 5200);
    await say('Now his great-granddaughter has come for it.', 5600);
    tweenOn(bay.st, 'floor', 1, 8000); await wait(5000);
    await say('The stone is still inside.', 5200);
  }
})();
</script>
</body>
</html>
