<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observer</title>
<meta name="description" content="A system built to observe human minds looks through a stone at the point where every line meets.">
<style>
/* each font cut to the one weight and the characters the page uses, so the page stays small on a phone */
@font-face { font-family: Cormorant; src: url(fonts/cormorant-300.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: Cormorant; src: url(fonts/cormorant-italic-400.woff2) format('woff2'); font-style: italic; font-weight: 400; }
@font-face { font-family: Mono; src: url(fonts/mono-400.woff2) format('woff2'); font-weight: 400; }
:root { --ink: #e9e4da; --dim: #8f8a80; --bg: #050506; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: Cormorant, Georgia, serif; -webkit-font-smoothing: antialiased; cursor: default; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#bay, #lab { opacity: 0; }
.cap { position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%); width: min(92vw, 760px); text-align: center;
  font-style: italic; font-weight: 400; font-size: clamp(20px, 2.6vw, 30px); line-height: 1.35; letter-spacing: .01em;
  opacity: 0; transition: opacity 1.4s ease; pointer-events: none; text-shadow: 0 0 18px #000; text-wrap: balance; }
.cap.on { opacity: 1; }
.place { position: fixed; left: 28px; top: 24px; font-family: Mono, monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase;
  color: var(--dim); opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
.place.on { opacity: 1; }
.skip { position: fixed; right: 24px; bottom: 20px; font-family: Mono, monospace; font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
  color: #4d4a45; background: none; border: 0; cursor: pointer; padding: 8px; }
.skip:hover { color: var(--dim); }
.sound { position: fixed; left: 18px; bottom: 14px; width: 40px; height: 40px; padding: 9px; background: none; border: 0; cursor: pointer; color: #8f8a80; transition: color .3s; }
.sound:hover { color: var(--ink); }
.sound svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sound svg path:first-child { fill: currentColor; fill-opacity: .18; }
/* the icon shows the state; hovering shows the state a click will give */
.sound .i-off, .sound.muted .i-on, .sound:hover .i-on, .sound.muted:hover .i-off { display: none; }
.sound.muted .i-off, .sound:hover .i-off, .sound.muted:hover .i-on { display: block; }
@media (hover: none) { .sound:hover .i-off { display: none; } .sound:hover .i-on { display: block; } .sound.muted:hover .i-on { display: none; } .sound.muted:hover .i-off { display: block; } }
.tip { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); font-family: Mono, monospace; font-size: 10px; letter-spacing: .3em;
  text-transform: uppercase; color: var(--dim); padding-left: .3em; opacity: 0; transition: opacity 1.6s ease; pointer-events: none; white-space: nowrap; }
.tip.on { opacity: .55; }
/* the way in: a button where the point will be. Clicked, it trembles, snaps flat into a line, and the line snaps shut
   into the point */
.begin { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: Mono, monospace; font-size: 11px; letter-spacing: .42em;
  text-transform: uppercase; color: #0a0a0b; background: var(--ink); border: 1px solid var(--ink); border-radius: 999px; padding: 13px 24px 13px calc(24px + .42em); font-weight: 400;
  cursor: pointer; opacity: 0; transition: opacity 1.4s ease, border-color .3s, background .3s, letter-spacing .9s cubic-bezier(.16, 1, .3, 1), padding-left .9s cubic-bezier(.16, 1, .3, 1);
  outline: 1px solid rgba(233,228,218,0); outline-offset: 0; }
.begin.on { opacity: .9; }
.begin:hover, .begin:focus-visible { background: #fff; border-color: #fff; box-shadow: 0 0 28px rgba(255,246,228,.18); }
/* hovered: two hairlines draw out from its ends toward the edges of the screen, foreshadowing the lines and the snap to a
   line; a ping widens off it faster than the point's heartbeat; its letters open a little. Phones have no hover */
.begin::before, .begin::after { content: ''; position: absolute; top: 50%; width: 50vw; height: 1px; pointer-events: none;
  transform: scaleX(0); transition: transform .6s cubic-bezier(.5, 0, .75, 0); }
.begin::before { right: 100%; transform-origin: right center; background: linear-gradient(to left, rgba(233,228,218,.25), rgba(233,228,218,0)); }
.begin::after { left: 100%; transform-origin: left center; background: linear-gradient(to right, rgba(233,228,218,.25), rgba(233,228,218,0)); }
@media (hover: hover) {
  .begin.on:hover:not(.tremble):not(.line):not(.shut) { letter-spacing: .5em; padding-left: calc(24px + .5em); animation: quickPing 1.1s cubic-bezier(.2, .6, .4, 1) infinite; }
  .begin.on:hover:not(.tremble):not(.line):not(.shut)::before, .begin.on:hover:not(.tremble):not(.line):not(.shut)::after { transform: scaleX(1); transition: transform .9s cubic-bezier(.16, 1, .3, 1); }
}
@keyframes quickPing { from { outline-offset: 0; outline-color: rgba(233,228,218,.45); } to { outline-offset: 22px; outline-color: rgba(233,228,218,0); } }
.begin:focus-visible { outline: 1px solid rgba(233,228,218,.45); outline-offset: 4px; }
.begin.tremble::before, .begin.tremble::after, .begin.line::before, .begin.line::after { transform: scaleX(0); transition: transform .2s; }
.begin.tremble, .begin.line, .begin.shut { animation: none; outline-color: rgba(233,228,218,0); }
.begin.tremble { animation: tremble .5s linear; }
@keyframes tremble {
  0% { transform: translate(-50%, -50%); } 10% { transform: translate(calc(-50% + 1px), calc(-50% - 1px)); } 20% { transform: translate(calc(-50% - 1px), calc(-50% + 1px)); }
  30% { transform: translate(calc(-50% + 2px), -50%); } 40% { transform: translate(calc(-50% - 2px), calc(-50% - 1px)); } 50% { transform: translate(calc(-50% + 2px), calc(-50% + 2px)); }
  60% { transform: translate(calc(-50% - 3px), calc(-50% - 1px)); } 70% { transform: translate(calc(-50% + 3px), calc(-50% + 1px)); } 80% { transform: translate(calc(-50% - 3px), calc(-50% + 2px)); }
  90% { transform: translate(calc(-50% + 4px), calc(-50% - 2px)); } 100% { transform: translate(-50%, -50%); } }
.begin.line { opacity: 1; color: transparent; background: var(--ink); border-color: var(--ink); transform: translate(-50%, -50%) scaleY(.04);
  transition: transform .11s cubic-bezier(.6, 0, 1, 1), background .06s, color .04s; }
.begin.shut { transform: translate(-50%, -50%) scale(0, .04); transition: transform .14s cubic-bezier(.7, 0, 1, 1); }
@media (max-width: 600px) { .place { left: 16px; top: 16px; } .cap { bottom: 14%; } }
</style>
</head>
<body>
<canvas id="bay"></canvas>
<canvas id="lab"></canvas>
<canvas id="c"></canvas>
<div class="cap" id="cap"></div>
<div class="place" id="place"></div>
<button class="skip" id="skip" aria-label="Skip to hold">skip</button>
<button class="sound" id="sound" aria-label="Turn sound off">
  <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="w" d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="m16 9.5 5 5m0-5-5 5"/></svg>
</button>
<div class="tip" id="tip"></div>
<button class="begin" id="begin">observe</button>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script>
(() => {

    lab: 0,           // the lab is showing

    lines: 0,         // how far the converging lines have drawn
    linesA: 0,        // their opacity

    flare: 0,         // the flash when the hold completes
    sea: 0,           // the bay: snow, the lamp's cone, the floor
    sink: 0,          // how far down the lamp has gone
    floor: 0,         // the silt rising into the light
    box: 0,           // the box caught in the light
    eye: 0,           // 1 once the pings are eyes
    pull: 0,          // the lines pulled in to the point, 0 to 1
    titleA: 0,        // the title's opacity, inside what the eyes have uncovered

  }; chk(); });

  const VOICE = { 'This is a point.': 'audio/voice-this-is-a-point.mp3?v=2', 'Every line, followed far enough, comes to it.': 'audio/voice-every-line-followed-far-enough.mp3?v=1', 'Follow one line back.': 'audio/voice-follow-one-line-back.mp3?v=1', 'It leads into Robert Blake’s mind.': 'audio/voice-it-leads-into-robert-blakes-mind.mp3?v=2', 'In 1935, Dr Dexter sank the Shining Trapezohedron here.': 'audio/voice-in-1935-dr-dexter-sank.mp3?v=1', 'Now his great-granddaughter has come for it.': 'audio/voice-now-his-great-granddaughter.mp3?v=1' };

  let titleW = 0, titleH = 0;

    tg.font = `300 ${fs}px Cormorant`;

  };

  let eyeT0 = 1e9, lastBeat = -1;     // when the eye leaves (with a ping); the last ping that beat

  // ---- the heartbeat: the two beats cut from the ElevenLabs take, in turn, or one made here (?beat=synth) ----
  // sound is on unless turned off (remembered in this browser); a browser lets it start only once the page is clicked,
  // tapped or a key pressed, so until then it waits
  let want = true; try { want = localStorage.getItem('observer-sound') !== 'off'; } catch (e) {}
  let ac = null, beats = [], beatN = 0, soundOn = false;
  const synth = new URLSearchParams(location.search).get('beat') === 'synth';
  const startSound = async () => {
    if (ac) { soundOn = true; ac.resume(); [...beats, sfx.lines, sfx.pull, sfx.follow].forEach(el => { if (!el || !el.paused) return; el.muted = true; el.play().then(() => { el.pause(); el.currentTime = 0; el.muted = false; }).catch(() => { el.muted = false; }); }); return; }

    // audio elements, not fetch, so the page plays from a file on disk as well as from a server; each is played once,

    const load = (u, vol) => { const el = new Audio(u); el.preload = 'auto'; el.volume = vol; el.muted = true;
      el.play().then(() => { el.pause(); el.currentTime = 0; el.muted = false; }).catch(() => { el.muted = false; }); return el; };
    if (!synth) beats = ['audio/heartbeat-1.mp3', 'audio/heartbeat-2.mp3'].map(u => load(u, .9));
    // the lines' sound and the pull's, cut from a waterphone and an Apprehension Engine (?lines=a-d, ?pull=a-b to compare)
    const q = new URLSearchParams(location.search);
    sfx.lines = load(`audio/lines-${/^[a-d]$/.test(q.get('lines')) ? q.get('lines') : 'a'}.mp3`, .55);
    for (const [line, u] of Object.entries(VOICE)) sfx[line] = load(u, 1);
    sfx.pull = load(`audio/pull-${/^[ab]$/.test(q.get('pull')) ? q.get('pull') : 'a'}.mp3`, .8);
    // Source cut: waterphone.wav 98.8–106.8 s, with a quiet two-tap echo tail.
    sfx.follow = load('audio/line-follow.mp3?v=1', .4);
    // a little of the Apprehension Engine while the button trembles; played at once inside the OBSERVE click, so not primed
    sfx.tremble = new Audio('audio/tremble.mp3?v=1'); sfx.tremble.volume = .6;
    // the descent: the splash as the lamp goes in, then bubbles, then the deep
    sfx.splash = load('audio/splash.mp3?v=1', .7);
    sfx.splash2 = load('audio/splash.mp3?v=1', .45);
    sfx.bubbles = load('audio/bubbles-loop.mp3?v=1', 0); sfx.bubbles.loop = true;
    sfx.deep = load('audio/deep-loop.mp3?v=1', 0); sfx.deep.loop = true;
  };
  // the loops under the descent, faded by hand and kept about 6 dB under a voice line while it plays
  const bed = { bubbles: 0, deep: 0 };
  const mixBed = () => {
    const duck = speaking ? .5 : 1;
    if (sfx.bubbles) sfx.bubbles.volume = Math.min(1, .35 * bed.bubbles * duck);
    if (sfx.deep) sfx.deep.volume = Math.min(1, .55 * bed.deep * duck);
    if (sfx.bubbles || sfx.deep) requestAnimationFrame(mixBed);
  };
  const descentSound = async () => {
    if (!soundOn || !sfx.splash) return;
    while (bay.lampY > 0) await wait(30);
    play('splash'); setTimeout(() => release('splash'), 5600);
    await wait(4300);
    requestAnimationFrame(mixBed);
    sfx.bubbles.play().catch(() => {}); tweenOn(bed, 'bubbles', 1, 900);

  // the ink: blots from all round the edge that spread inward, wobbling, with drops thrown ahead of them, until all is black
  const blots = Array.from({ length: 30 }, (_, i) => {

      drops: Array.from({ length: 4 }, () => ({ a: Math.random() * 6.28, r: .05 + Math.random() * .07, o: 1.08 + Math.random() * .25 })) };
  });
  const inkFill = document.createElement('canvas');
  const drawInkFill = k => {
    if (k >= .995) { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); return; }
    const iw = Math.ceil(W / 3), ih = Math.ceil(H / 3);
    if (inkFill.width !== iw || inkFill.height !== ih) { inkFill.width = iw; inkFill.height = ih; }
    const x = inkFill.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, iw, ih); x.setTransform(1 / 3, 0, 0, 1 / 3, 0, 0);

      for (const d of b.drops) { x.beginPath(); x.arc(bx + Math.cos(d.a) * R * d.o, by + Math.sin(d.a) * R * d.o, R * d.r, 0, 7); x.fill(); }

  // the first tap or key lets the sound start (a browser plays nothing before one)
  const firstGesture = e => {
    if (e.target && e.target.closest && e.target.closest('#sound')) return;
    removeEventListener('pointerdown', firstGesture); removeEventListener('keydown', firstGesture);
    hideTip('sound'); if (want) startSound();
  };
  addEventListener('pointerdown', firstGesture); addEventListener('keydown', firstGesture);
  // where the browser already allows it, start at once
  if (want) { startSound(); if (ac && ac.state === 'running') { removeEventListener('pointerdown', firstGesture); removeEventListener('keydown', firstGesture); } }
  $('skip').onclick = () => { skipping = true; $('cap').classList.remove('on'); $('skip').style.display = 'none'; };

  // ---- while OBSERVE waits: after the first paint, in idle moments, the bay (three.js, its models and plate) loads and its
  // shaders are made ready, and the ping's gradient is drawn once offscreen, so nothing stalls once it starts ----
  const whenIdle = f => window.requestIdleCallback ? requestIdleCallback(f, { timeout: 1500 }) : setTimeout(f, 200);
  addEventListener('load', () => whenIdle(() => {
    if (q0.get('at')) return;
    loadBay();
    const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 30); gr.addColorStop(0, 'rgba(255,246,228,.9)'); gr.addColorStop(1, 'rgba(255,236,206,0)');
    x.fillStyle = gr; x.beginPath(); x.arc(32, 32, 30, 0, 7); x.fill(); x.strokeStyle = 'rgba(255,246,228,.5)'; x.beginPath(); x.arc(32, 32, 20, 0, 7); x.stroke();
  }));
  // ---- tips: at the very bottom, faint, shown for a few seconds only when needed ----
  let tipKey = null, tipTimer = 0;
  const tip = (key, text, ms) => { clearTimeout(tipTimer); tipKey = key; $('tip').textContent = text; $('tip').classList.add('on'); tipTimer = setTimeout(() => hideTip(key), ms); };
  const hideTip = key => { if (tipKey === key) { $('tip').classList.remove('on'); tipKey = null; } };
  // ---- the opening ----
  (async () => {
    // nothing but the way in; its click is what lets a browser play the sound
    const b = $('begin'); await wait(400); b.classList.add('on'); b.focus({ preventScroll: true });
    if (q0.get('at') === 'bay') { b.remove(); S.pt = 1; skipping = false; loadBay(); await bayScene(); return; }
    if (q0.get('at') === 'lab') { b.remove(); S.pt = 1; S.bay = 1; S.ink = 1; skipping = false; if (await loadLab()) await labScene(); return; }
    await new Promise(res => b.addEventListener('click', e => { e.stopPropagation(); if (want) { startSound(); play('tremble'); } loadBay(); res(); }, { once: true }));
    b.blur(); b.classList.add('tremble'); await wait(500);
    b.classList.remove('tremble'); b.classList.add('line'); await wait(110);
    b.classList.add('shut'); await wait(140);
    b.remove();
    // the point, born where the line shut, and its first heartbeat at once
    t = 0; lastBeat = -1; S.pt = 1;
    await wait(2200);
    await say('This is a point.', 3200);
    tween('linesA', 1, 1600); tween('lines', 1, 6500, t => t); if (!skipping) play('lines');
    await say('Every line, followed far enough, comes to it.', 5200);
    await wait(skipping ? 0 : 600);
    tween('lines', 1, 300); $('skip').style.display = 'none';
    eyeT0 = Math.ceil(t / 3.33) * 3.33; S.eye = 1; S.titleA = 1; await wait((eyeT0 - t) * 1000 + 2400);
    // the tip only if the point has not been observed after a while, and again now and then
    const howTo = matchMedia('(hover: hover) and (pointer: fine)').matches ? 'rest the cursor on the point' : 'tap the point';
    let observed = false;
    (async () => { await wait(4000); while (!observed) { tip('observe', howTo, 4500); await wait(16000); } })();
    await waitHold(); observed = true;
    hideTip('observe'); tween('titleA', 0, 900); tween('eye', 0, 900);
    // All but one line withdraw in silence while the eye and title unravel into black.
    await tween('pull', 1, 1100, k => k * k * k); S.ring = 0;
    skipping = false;
    if (await loadBay()) {
      await Promise.race([bay.ready, wait(8000)]);
      play('follow');
      followVolume(true);
      const voices = (async () => {
        await say('Follow one line back.', 3400);
        followVolume(false);
        await say('It leads into Robert Blake’s mind.', 3800);
      })();
      await tween('follow', 1, 8400, k => k * k * (3 - 2 * k));
      S.bay = 1; tween('linesA', 0, 1400);
      await tween('edge', 0, 1000);
      S.follow = 0; $('bay').style.transform = '';
      // the opening is over: its sounds and the title's canvas are let go
      for (const k of ['lines', 'pull', 'follow', 'tremble']) release(k);
      titleCv.width = titleCv.height = 0; titleW = 0;
      await voices;
      return bayScene();
    }
    // without WebGL: the point becomes a lamp, going down on a cable into the bay
    tween('py', .3, 2800); tween('sea', 1, 3200); await wait(2600);
    $('place').textContent = 'Narragansett Bay · the deepest channel · now'; $('place').classList.add('on');
    tween('sink', 1, 9000);
    await say('In 1935, Dr Dexter sank the Shining Trapezohedron here.', 5200);
    await say('Now his great-granddaughter has come for it.', 5600);
    tween('floor', 1, 5200); await wait(2600);
    tween('box', 1, 4200);
  })();
  // the bay opens round the point: the lamp on its cable from the survey boat's A-frame, just over the water. Observed
  // again, it goes down, and the view follows it under until there is nothing but the point, pinging in the dark
  const howToNow = () => matchMedia('(hover: hover) and (pointer: fine)').matches ? 'rest the cursor on the point' : 'tap the point';
  async function bayScene() {
    await loadBay(); await Promise.race([bay.ready, wait(8000)]);
    $('skip').style.display = 'none';
    $('place').textContent = 'Narragansett Bay · the deepest channel · now'; $('place').classList.add('on');
    await tween('bay', 1, 4200);
    const howTo = matchMedia('(hover: hover) and (pointer: fine)').matches ? 'rest the cursor on the point' : 'tap the point';
    let observed = false;
    (async () => { await wait(7000); while (!observed) { tip('observe', howTo, 4500); await wait(16000); } })();
    // a cursor still resting where the point was must leave it first; coming back to it is the choice to go down
    while (mouse.on && near()) await wait(100);
    while (true) {
      const choice = await waitHold();
      bay.st.diveArmed = true;
      if (choice !== 'mouse') break;
      while (mouse.on && near() && bay.st.zoom < .96) await wait(50);
      if (mouse.on && near()) break;
      bay.st.diveArmed = false; bay.st.zoomTarget = 0; S.ring = 0;
      while (mouse.on && near()) await wait(100);
    }
    observed = true; hideTip('observe');
    bay.st.zoomTarget = 1;
    while (bay.st.zoom < .96) await wait(50);
    S.ring = 0; $('place').classList.remove('on');
    // one continuous descent: both lines are said from the moment the lamp hits the water, and it reaches the floor just after them
    const diveMs = 17000, dive0 = performance.now();
    tweenOn(bay.st, 'dive', 1, diveMs, k => k);
    descentSound();
    // as the view itself goes under: a wash of water and a burst of bubbles, and the splash again, softer and shorter
    (async () => {
      while (bay.camera.position.y > 0) await wait(20);
      washT0 = t;
      if (soundOn && sfx.splash2) { play('splash2'); await wait(1200); await tweenOn(sfx.splash2, 'volume', 0, 400); }
      release('splash2');
    })();
    while (bay.lampY > 0) await wait(30);
    await say('In 1935, Dr Dexter sank the Shining Trapezohedron here.', 5200);
    await say('Now his great-granddaughter has come for it.', 5600);
    const left = Math.max(2500, diveMs - (performance.now() - dive0));
    tweenOn(bay.st, 'floor', 1, left);
    await wait(left);
    // the view holds on the lamp at the floor until the lamp is observed; only then does it close in and bring the stone
    // to the centre, the ping passing from the lamp to the stone
    let lampSeen = false;
    (async () => { await wait(7000); while (!lampSeen) { tip('observe', howTo, 4500); await wait(16000); } })();
    await waitHold(); lampSeen = true; hideTip('observe');
    S.ring = 0;
    tweenOn(bay.st, 'close', 1, 3200);
    await tweenOn(bay.st, 'stone', 1, 3200);
    // resting on the stone (after leaving it and coming back) floods the view with ink, slow at first, then all at once
    let seen = false;
    (async () => { await wait(7000); while (!seen) { tip('observe', howTo, 4500); await wait(16000); } })();
    await waitHold(); seen = true; hideTip('observe');
    S.ring = 0;
    // the lab loads while the ink closes; the sea's sound goes down with the light
    const labReady = loadLab();
    if (sfx.deep) tweenOn(bed, 'deep', 0, 3200);
    await tween('ink', 1, 3600, k => k * k * k);
    // all black: the bay is let go, every model, texture and sound of it
    release('deep'); release('bubbles');
    bay.dispose(); $('bay').remove(); bay = null; window.observerBay = null;
    if (!(await labReady)) return;
    return labScene();
  }
  // Ruth's lab: the ink draws back off the room; the box on the table pings; resting on it opens it
  async function labScene() {
    // its first frame, with every shader and texture made ready, is drawn while the screen is still black
    lab.render(0); await wait(50);
    $('lab').style.opacity = 1; S.lab = 1; $('skip').style.display = 'none';
    await tween('ink', 0, 3200, k => 1 - Math.pow(1 - k, 3));
    let seen = false;
    (async () => { await wait(7000); while (!seen) { tip('observe', howToNow(), 4500); await wait(16000); } })();
    await waitHold(); seen = true; hideTip('observe');
    S.ring = 0;
    await tweenOn(lab.st, 'open', 1, 2800);
  }
})();
</script>
